<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rakshak AI - Standee Print Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --bg-accent: #0f172a;
            --primary: #3b82f6;
            --neon-glow: rgba(59, 130, 246, 0.4);
            --p-glow: #ec4899;
        }
        body {
            margin: 0; padding: 0; background: #222; 
            font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        /* Standee Container (11.5 x 18.5 aspect ratio) */
        .standee {
            width: 11.5in; height: 18.5in;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-accent) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 1.5in 0.8in; box-sizing: border-box; position: relative;
            border: 4px solid rgba(255,255,255,0.02); overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }
        /* Aesthetic Cyber Grid Overlay */
        .standee::before {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 0.3in 0.3in; opacity: 0.5; z-index: 1;
        }
        /* Gradient light ambient */
        .standee::after {
            content: ''; position: absolute; width: 8in; height: 8in; background: var(--primary);
            filter: blur(140px); opacity: 0.15; top: -3in; left: 50%; transform: translateX(-50%); z-index: 0;
        }
        .content { z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; flex: 1; justify-content: space-around; }
        
        /* Logo (Shield) */
        .logo-wrap {
            background: rgba(59, 130, 246, 0.08); padding: 0.5in; border-radius: 50%;
            border: 2px solid rgba(59, 130, 246, 0.2); box-shadow: 0 0 50px rgba(59, 130, 246, 0.3);
            margin-bottom: 0.2in;
        }
        .logo-shield { width: 1.2in; height: 1.2in; fill: var(--primary); }
        
        /* Typography */
        h1 {
            font-family: 'Orbitron', sans-serif; font-size: 0.6in; font-weight: 900; letter-spacing: 4px;
            color: #fff; margin: 0 0 0.15in 0; text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .tagline {
            font-size: 0.3in; font-weight: 600; color: #94a3b8; max-width: 80%; line-height: 1.4; margin-bottom: 0.8in;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.3in;
        }

        /* QR Core Card */
        .qr-card {
            background: #fff; padding: 0.4in; border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 30px rgba(59, 130, 246, 0.2);
            border: 4px solid var(--primary); position: relative;
        }
        .qr-img { width: 4in; height: 4in; border-radius: 12px; }
        .scan-text {
            color: #0d1523; font-weight: 800; font-size: 0.18in; letter-spacing: 2px;
            margin-top: 0.2in; text-transform: uppercase;
        }

        /* Footer messaging */
        .footer {
            margin-top: auto; color: #64748b; font-size: 0.18in; font-weight: 600; letter-spacing: 1.5px;
            display: flex; gap: 0.1in; align-items: center;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 10px var(--primary); }

        /* Print Settings for standard fitting */
        @media print {
            body { background: none; }
            .standee {
                box-shadow: none !important; border: none !important; page-break-inside: avoid;
                width: 11.5in !important; height: 18.5in !important;
            }
        }
    </style>
</head>
<body>
    <div class="standee">
        <div class="content">
            <!-- LOGO HEADER -->
            <div class="logo-wrap">
                <svg class="logo-shield" viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M12 22s-8-4-8-10V5l8-3 8 3v7c0 6-8 10-8 10z" opacity="0.5"/>
                </svg>
            </div>
            
            <!-- APPS NAME & TAGLINE -->
            <div>
                <h1>RAKSHAK AI</h1>
                <div class="tagline">Your shield against digital fraud.</div>
            </div>

            <!-- QR CORE SCREEN -->
            <div class="qr-card">
                <img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://rakshak-ai-git-main-deeksha-bansals-projects.vercel.app" alt="QR Code">
                <div class="scan-text">SCAN CONTINUOUSLY TO ACTIVATE</div>
            </div>

            <!-- FOOTER LABELS -->
            <div class="footer">
                <span>SECURE PAYLOAD</span>
                <div class="dot"></div>
                <span>CYBERCELL PORTAL</span>
                <div class="dot"></div>
                <span>LIVE DEFENSE</span>
            </div>
        </div>
    </div>
</body>
</html>
