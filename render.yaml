services:
  - type: web
    name: rakshak-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn -k uvicorn.workers.UvicornWorker server:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rakshak-db
          property: connectionString
      - key: ALLOW_INSECURE_KEY
        value: "1"

databases:
  - name: rakshak-db
    plan: free
