databases:
  # Render-managed PostgreSQL — free tier, persists across deploys
  - name: rakshak-ai-db
    databaseName: rakshak_ai
    user: rakshak_user
    plan: free          # upgrade to 'starter' in production for dedicated resources

services:
  # Backend FastAPI Service
  - type: web
    name: rakshak-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure value
      - key: ALLOW_INSECURE_KEY
        value: ""                    # Leave empty — server refuses to start without SECRET_KEY
      - key: PYTHON_VERSION
        value: 3.11.0

      # ── Database ───────────────────────────────────────────────────────────────
      # Automatically wired to the PostgreSQL instance defined in the databases: block above.
      # Render injects the full connection string (postgresql://user:pass@host/db).
      # Falls back to SQLite automatically in local dev (see database.py).
      - key: DATABASE_URL
        fromDatabase:
          name: rakshak-ai-db
          property: connectionString

      # ── Redis ─────────────────────────────────────────────────────────────────
      # Provision a Render Redis instance and paste its Internal Redis URL here.
      - key: REDIS_URL
        sync: false                  # Set in Render dashboard — do NOT commit to git

      # ── External Integrations ─────────────────────────────────────────────────
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: GROQ_API_KEY
        sync: false
