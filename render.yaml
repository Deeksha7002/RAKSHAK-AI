services:
  # Backend FastAPI Service
  - type: web
    name: rakshak-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure value
      - key: ALLOW_INSECURE_KEY
        value: ""                    # Leave empty in production — server will refuse to start without SECRET_KEY
      - key: PYTHON_VERSION
        value: 3.11.0

      # ── Database ───────────────────────────────────────────────────────────────
      # SQLite is fine for local development and demos.
      # For production with multiple dynos, provision a Render PostgreSQL instance
      # and set DATABASE_URL to the connection string it provides (postgres://...).
      - key: DATABASE_URL
        value: sqlite:///rakshak_ai.db

      # ── Redis ─────────────────────────────────────────────────────────────────
      # Required for agent state persistence across requests and multi-instance
      # WebSocket fan-out.  Provision a Render Redis instance and paste its
      # Internal Redis URL here.
      - key: REDIS_URL
        sync: false                  # Set in Render dashboard — do NOT commit to git

      # ── External Integrations ─────────────────────────────────────────────────
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: GROQ_API_KEY
        sync: false

