services:
  db:
    image: postgres:15
    container_name: honeypot-postgres
    environment:
      POSTGRES_USER: rakshak
      POSTGRES_PASSWORD: rakshakpassword
      POSTGRES_DB: honeypot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: honeypot-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: honeypot-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://rakshak:rakshakpassword@db:5432/honeypot_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: honeypot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
