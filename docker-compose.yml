version: '3.8'

services:
  # ── 1. Rakshak AI FastAPI Backend Server ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rakshak_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://rakshak_admin:rakshak_secure_pass@db:5432/rakshak_prod
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - SECRET_KEY=production-secret-key-change-this-in-env
      - ALGORITHM=HS256
    depends_on:
      db:
        condition: service_healthy   # Wait for PostgreSQL to be ready before starting
      cache:
        condition: service_healthy  # Wait for Redis to be ready before starting
    networks:
      - rakshak_network

  # ── 2. Production PostgreSQL Database (Persistent Threat Metrics) ──────────
  db:
    image: postgres:16-alpine
    container_name: rakshak_database
    restart: always
    environment:
      - POSTGRES_USER=rakshak_admin
      - POSTGRES_PASSWORD=rakshak_secure_pass
      - POSTGRES_DB=rakshak_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakshak_admin -d rakshak_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rakshak_network

  # ── 3. Redis In-Memory Cache (Ephemeral Decoy Mapping Gateway) ──────────────
  cache:
    image: redis:7-alpine
    container_name: rakshak_cache
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rakshak_network

# ── Persistent Storage Volumes ────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

# ── Isolated Virtual Networks ─────────────────────────────────────────────────
networks:
  rakshak_network:
    driver: bridge
